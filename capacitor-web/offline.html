<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyDiet</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #171717;
        --muted: #666666;
        --accent: #16a34a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --text: #f5f5f5;
          --muted: #a3a3a3;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 12px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Sem conexão</h1>
    <p>O MyDiet precisa de internet para abrir. Verifique sua conexão e tente de novo.</p>
    <a href="https://controle-dieta.vercel.app">Tentar de novo</a>
  </body>
</html>
